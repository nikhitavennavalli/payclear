<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PayClear - Fast Payments</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f4f6f9; }
        .card { background: white; padding: 24px; border-radius: 8px; max-width: 550px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
        h2 { margin-top: 0; color: #333; }
        label { display: block; margin-top: 12px; font-weight: bold; }
        input { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { margin-top: 16px; padding: 10px 16px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; width: 100%; font-size: 16px; }
        button:hover { background-color: #0056b3; }
        #responseMessage { margin-top: 16px; font-weight: bold; }

        /* Table Styles */
        table { width: 100%; border-collapse: collapse; margin-top: 12px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #007bff; color: white; }
    </style>
</head>
<body>

<div class="card">
    <h2>PayClear Transaction</h2>

    <label for="payerName">Payer Name:</label>
    <input type="text" id="payerName" placeholder="Enter name">

    <label for="amount">Amount ($):</label>
    <input type="number" id="amount" placeholder="Enter amount">

    <button onclick="submitPayment()">Submit Payment</button>

    <div id="responseMessage"></div>
</div>

<div class="card">
    <h2>Recent Transactions</h2>
    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Payer Name</th>
            <th>Amount ($)</th>
            <th>Status</th>
        </tr>
        </thead>
        <tbody id="paymentTableBody">
        <!-- Dynamic rows will load here -->
        </tbody>
    </table>
</div>

<script>
    // Load existing transactions when the page loads
    window.onload = loadPayments;

    async function loadPayments() {
        try {
            const response = await fetch('/api/payments');
            const payments = await response.json();
            const tableBody = document.getElementById('paymentTableBody');
            tableBody.innerHTML = '';

            payments.forEach(payment => {
                const row = `<tr>
                    <td>${payment.id}</td>
                    <td>${payment.payerName}</td>
                    <td>${payment.amount}</td>
                    <td>${payment.status}</td>
                </tr>`;
                tableBody.innerHTML += row;
            });
        } catch (error) {
            console.error('Error fetching payments:', error);
        }
    }

    async function submitPayment() {
        const payerName = document.getElementById('payerName').value;
        const amount = document.getElementById('amount').value;
        const messageDiv = document.getElementById('responseMessage');

        if (!payerName || !amount) {
            messageDiv.style.color = 'red';
            messageDiv.innerText = 'Please fill out all fields.';
            return;
        }

        const paymentData = { payerName: payerName, amount: parseFloat(amount) };

        try {
            const response = await fetch('/api/payments', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(paymentData)
            });

            if (response.ok) {
                const data = await response.json();
                messageDiv.style.color = 'green';
                messageDiv.innerText = `Payment Successful! ID: ${data.id}`;
                document.getElementById('payerName').value = '';
                document.getElementById('amount').value = '';
                loadPayments(); // Refresh table automatically
            } else {
                messageDiv.style.color = 'red';
                messageDiv.innerText = 'Transaction failed.';
            }
        } catch (error) {
            messageDiv.style.color = 'red';
            messageDiv.innerText = 'Error connecting to server.';
        }
    }
</script>

</body>
</html>
